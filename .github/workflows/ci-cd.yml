  ```yaml
  name: CI/CD

  on:
    push:
      branches:
        - main

  jobs:
    ci:
      name: CI - Build & Tests
      runs-on: ubuntu-latest

      env:
        JWT_SECRET: ${{ secrets.JWT_SECRET }}

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Setup Java 17
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '17'
            cache: maven

        - name: Build without tests
          run: mvn -B clean compile

        - name: Run tests
          run: mvn -B test -Dspring.profiles.active=test

        - name: Verify build
          run: mvn -B verify -Dspring.profiles.active=test

    docker:
      name: CD - Docker Image
      needs: ci
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Build Docker image
          run: docker build -t filerouge-backend:latest .
    ```
