name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  ci:
    name: CI - Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build without tests
        run: |
          chmod +x mvnw
          ./mvnw -B clean compile

      - name: Run tests
        run: |
          chmod +x mvnw
          ./mvnw -B test -Dspring.profiles.active=test

      - name: Verify build
        run: |
          chmod +x mvnw
          ./mvnw -B verify -Dspring.profiles.active=test

  docker:
    name: CD - Docker Image
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t fileRouge-backend:latest .